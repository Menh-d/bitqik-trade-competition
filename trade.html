<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bitqik Demo Futures Trading Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange-accent: #FF6B00;
      --orange-light: #FF9433;
      --bg-dark: #0A0806;
      --bg-panel: #140E0A;
      --text-sub: #E8D5C8;
      --gold: #FFC700;
      --green: #00FF88;
      --red: #FF4060;
      --border: rgba(255, 107, 0, 0.18);
      --font-lao: 'Noto Sans Lao', sans-serif;
    }

    body { font-family: var(--font-lao); background: var(--bg-dark); color: #FFFFFF; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* TOP BAR */
    header { height: 56px; background: rgba(10, 8, 6, 0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; flex-shrink: 0; }
    .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-logo-img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 1px solid var(--orange-accent); }
    .brand-title { font-family: var(--font-lao); font-weight: 800; font-size: 1.1rem; color: #FFFFFF; text-transform: lowercase; }

    .ticker-bar { display: flex; align-items: center; gap: 2rem; }
    .symbol-badge { background: rgba(255,107,0,0.15); border: 1px solid var(--orange-accent); color: var(--gold); padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 0.85rem; }
    .live-price { font-family: var(--font-lao); font-weight: 900; font-size: 1.25rem; color: var(--green); }

    .user-balance-box { background: rgba(255,107,0,0.1); border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; font-size: 0.82rem; }
    .user-balance-val { font-weight: 800; color: var(--gold); }

    /* MAIN TRADING GRID */
    .trading-layout { flex: 1; display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 1fr 180px; height: calc(100vh - 56px); }

    /* CHART AREA */
    .chart-panel { grid-column: 1; grid-row: 1; background: #070504; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); position: relative; }
    #chart-container { width: 100%; height: 100%; }

    /* ORDER PANEL */
    .order-panel { grid-column: 2; grid-row: 1 / 3; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 1.2rem; display: flex; flex-direction: column; gap: 1.2rem; overflow-y: auto; }
    .order-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .tab-btn { padding: 10px; border-radius: 8px; border: none; font-family: var(--font-lao); font-weight: 800; font-size: 0.95rem; cursor: pointer; opacity: 0.5; transition: all 0.2s; }
    .tab-btn.active.long { opacity: 1; background: var(--green); color: #000; box-shadow: 0 4px 15px rgba(0,255,136,0.4); }
    .tab-btn.active.short { opacity: 1; background: var(--red); color: #fff; box-shadow: 0 4px 15px rgba(255,64,96,0.4); }

    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-label { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; }
    .input-field { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; color: #fff; font-weight: 700; font-family: var(--font-lao); outline: none; }

    .leverage-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
    .lev-btn { background: rgba(255,107,0,0.08); border: 1px solid var(--border); color: var(--text-sub); padding: 6px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .lev-btn.active { border-color: var(--orange-accent); background: var(--orange-accent); color: #fff; }

    .btn-submit-order { padding: 12px; border-radius: 100px; border: none; font-family: var(--font-lao); font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: auto; }
    .btn-submit-order.long { background: linear-gradient(135deg, #00C96B, #00FF88); color: #000; box-shadow: 0 6px 20px rgba(0,255,136,0.4); }
    .btn-submit-order.short { background: linear-gradient(135deg, #D32F2F, #FF4060); color: #fff; box-shadow: 0 6px 20px rgba(255,64,96,0.4); }

    /* POSITIONS PANEL */
    .positions-panel { grid-column: 1; grid-row: 2; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; }
    .pos-table { width: 100%; border-collapse: collapse; font-family: var(--font-lao); font-size: 0.85rem; text-align: left; }
    .pos-table th { background: rgba(255,107,0,0.1); color: var(--text-sub); padding: 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; }
    .pos-table td { padding: 0.7rem 0.6rem; border-bottom: 1px solid rgba(255,107,0,0.08); }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">
      <img src="assets/bitqik_logo.png" alt="bitqik Logo" class="brand-logo-img" />
      <span class="brand-title">bitqik</span>
    </a>
    <div class="ticker-bar">
      <span class="symbol-badge">BTC-PERP</span>
      <span class="live-price" id="top-price">$65,240.50</span>
    </div>
    <div class="user-balance-box">
      <span>Demo Balance: </span><span class="user-balance-val" id="user-bal">$10.00 USDT</span>
    </div>
  </header>

  <div class="trading-layout">
    <div class="chart-panel"><div id="chart-container"></div></div>

    <div class="order-panel">
      <div class="order-tabs">
        <button class="tab-btn active long" onclick="setSide('LONG')">LONG</button>
        <button class="tab-btn short" onclick="setSide('SHORT')">SHORT</button>
      </div>

      <div class="input-group">
        <span class="input-label">Leverage</span>
        <div class="leverage-btn-grid">
          <button class="lev-btn" onclick="setLev(5)">5x</button>
          <button class="lev-btn" onclick="setLev(10)">10x</button>
          <button class="lev-btn active" onclick="setLev(20)">20x</button>
          <button class="lev-btn" onclick="setLev(50)">50x</button>
        </div>
      </div>

      <div class="input-group">
        <span class="input-label">Margin (USDT)</span>
        <input type="number" id="margin-val" value="10" class="input-field" />
      </div>

      <div style="font-size:0.8rem; color:var(--text-sub); display:flex; flex-direction:column; gap:0.4rem; background:rgba(0,0,0,0.3); padding:0.8rem; border-radius:8px;">
        <div style="display:flex; justify-content:space-between;"><span>Position Size:</span><span id="pos-size-val">0.0030 BTC</span></div>
        <div style="display:flex; justify-content:space-between;"><span>Liq Price (Est):</span><span style="color:var(--red);" id="liq-price-val">$62,100</span></div>
      </div>

      <button class="btn-submit-order long" id="btn-submit" onclick="executeTrade()">Open LONG Position</button>
    </div>

    <div class="positions-panel">
      <h4 style="font-family:var(--font-lao); margin-bottom:0.6rem; color:var(--orange-light);">Open Positions</h4>
      <table class="pos-table">
        <thead>
          <tr><th>Symbol</th><th>Side</th><th>Size</th><th>Leverage</th><th>Entry Price</th><th>Mark Price</th><th>P&L %</th><th>Action</th></tr>
        </thead>
        <tbody id="pos-tbody">
          <tr><td colspan="8" style="text-align:center; color:var(--text-sub);">No active open positions</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  let side = 'LONG';
  let lev = 20;
  let currentPrice = 65240.50;
  let chart, candleSeries;
  let currentPos = JSON.parse(localStorage.getItem('bitqik_trade_position') || 'null');

  function initChart() {
    const container = document.getElementById('chart-container');
    chart = LightweightCharts.createChart(container, {
      layout: { background: { color: '#070504' }, textColor: '#E8D5C8' },
      grid: { vertLines: { color: 'rgba(255,107,0,0.03)' }, horzLines: { color: 'rgba(255,107,0,0.03)' } }
    });
    candleSeries = chart.addCandlestickSeries({ upColor: '#00FF88', downColor: '#FF4060' });

    fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=100')
      .then(res => res.json())
      .then(data => {
        const candles = data.map(d => ({ time: d[0]/1000, open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) }));
        candleSeries.setData(candles);
        if(candles.length>0) currentPrice = candles[candles.length-1].close;
        renderPos();
      });

    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1m');
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.k) {
        currentPrice = parseFloat(msg.k.c);
        candleSeries.update({ time: msg.k.t/1000, open: parseFloat(msg.k.o), high: parseFloat(msg.k.h), low: parseFloat(msg.k.l), close: currentPrice });
        document.getElementById('top-price').textContent = `$${currentPrice.toFixed(2)}`;
        renderPos();
      }
    };
  }

  function setSide(s) {
    side = s;
    const btn = document.getElementById('btn-submit');
    btn.className = `btn-submit-order ${side.toLowerCase()}`;
    btn.textContent = `Open ${side} Position`;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tab-btn.${side.toLowerCase()}`).classList.add('active');
  }

  function setLev(l) {
    lev = l;
    document.querySelectorAll('.lev-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function executeTrade() {
    const margin = parseFloat(document.getElementById('margin-val').value) || 10;
    currentPos = { symbol: 'BTC-PERP', side, margin, leverage: lev, entryPrice: currentPrice };
    localStorage.setItem('bitqik_trade_position', JSON.stringify(currentPos));
    renderPos();
  }

  function closeTrade() {
    currentPos = null;
    localStorage.removeItem('bitqik_trade_position');
    renderPos();
  }

  function renderPos() {
    const tbody = document.getElementById('pos-tbody');
    if (!currentPos) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-sub);">No active open positions</td></tr>`;
      return;
    }
    let deltaPct = (currentPrice - currentPos.entryPrice) / currentPos.entryPrice;
    if (currentPos.side === 'SHORT') deltaPct = -deltaPct;
    const pnlPct = deltaPct * currentPos.leverage * 100;

    tbody.innerHTML = `
      <tr>
        <td><strong>${currentPos.symbol}</strong></td>
        <td style="color:${currentPos.side==='LONG'?'var(--green)':'var(--red)'}; font-weight:800;">${currentPos.side}</td>
        <td>$${(currentPos.margin * currentPos.leverage).toFixed(2)}</td>
        <td>${currentPos.leverage}x</td>
        <td>$${currentPos.entryPrice.toFixed(2)}</td>
        <td>$${currentPrice.toFixed(2)}</td>
        <td style="font-weight:900; color:${pnlPct>=0?'var(--green)':'var(--red)'};">${pnlPct>=0?'+':''}${pnlPct.toFixed(2)}%</td>
        <td><button onclick="closeTrade()" style="background:rgba(255,64,96,0.2); color:var(--red); border:1px solid var(--red); padding:4px 10px; border-radius:4px; cursor:pointer; font-weight:800;">Close</button></td>
      </tr>
    `;
  }

  initChart();
</script>
</body>
</html>
