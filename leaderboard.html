<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitqik Trade Championship - Live Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange-accent: #FF6B00;
      --orange-light: #FF9433;
      --bg-dark: #0A0806;
      --bg-panel: #140E0A;
      --text-sub: #E8D5C8;
      --gold: #FFC700;
      --green: #00FF88;
      --red: #FF4060;
      --font-lao: 'Noto Sans Lao', sans-serif;
    }

    body { font-family: var(--font-lao); background: var(--bg-dark); color: #FFFFFF; min-height: 100vh; overflow-x: hidden; }

    .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #0A0806; }
    .orange-ambient-light { position: fixed; width: 1000px; height: 900px; left: 50%; top: -150px; transform: translateX(-50%); background: rgba(255, 107, 0, 0.3); filter: blur(240px); border-radius: 50%; pointer-events: none; z-index: 0; }
    .grid-lines { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(255, 107, 0, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 107, 0, 0.04) 1px, transparent 1px); background-size: 60px 60px; }

    .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.5rem 5rem; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0 2rem; border-bottom: 1px solid rgba(255,107,0,0.15); margin-bottom: 2rem; }
    .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-logo-img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; border: 1.5px solid var(--orange-accent); box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4); }
    .brand-title { font-family: var(--font-lao); font-weight: 800; font-size: 1.25rem; color: #FFFFFF; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
    .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 0.9rem; font-weight: 600; }

    .page-title { text-align: center; margin-bottom: 2.5rem; }
    .live-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.3); color: var(--green); padding: 6px 18px; border-radius: 100px; font-size: 0.8rem; font-family: var(--font-lao); font-weight: 700; text-transform: uppercase; margin-bottom: 1rem; }

    .page-title h1 { font-family: var(--font-lao); font-size: 2.4rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
    .page-title h1 span { color: var(--orange-accent); }

    .podium-grid { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 1.2rem; align-items: end; margin-bottom: 3rem; }
    .podium-card { background: rgba(255, 107, 0, 0.05); border: 1px solid rgba(255, 107, 0, 0.2); border-radius: 24px; padding: 2rem 1.2rem; text-align: center; backdrop-filter: blur(16px); position: relative; }
    .podium-card.rank-1 { border-color: var(--orange-accent); background: linear-gradient(135deg, rgba(255, 107, 0, 0.2), rgba(10, 8, 6, 0.8)); transform: translateY(-10px); box-shadow: 0 15px 40px rgba(255, 107, 0, 0.3); }
    .podium-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #C94A00, #FF6B00); color: #fff; font-family: var(--font-lao); font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.8rem; box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4); }
    .podium-name { font-weight: 800; font-size: 1.1rem; color: #fff; margin-bottom: 0.2rem; }
    .podium-pnl { font-family: var(--font-lao); font-weight: 900; font-size: 1.8rem; color: var(--green); line-height: 1.1; }

    .lead-table-box { background: rgba(255, 107, 0, 0.05); border: 1px solid rgba(255, 107, 0, 0.2); border-radius: 24px; overflow: hidden; backdrop-filter: blur(16px); }
    .lead-table { width: 100%; border-collapse: collapse; font-family: var(--font-lao); font-size: 0.9rem; text-align: left; }
    .lead-table th { background: rgba(255, 107, 0, 0.18); color: #FFFFFF; font-weight: 800; padding: 1rem 1.2rem; border-bottom: 1px solid rgba(255, 107, 0, 0.2); font-size: 0.82rem; text-transform: uppercase; }
    .lead-table td { padding: 0.9rem 1.2rem; border-bottom: 1px solid rgba(255,107,0,0.08); }
    .lead-table tr.user-row td { background: rgba(255, 107, 0, 0.2); font-weight: 800; }
  </style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="orange-ambient-light"></div>
<div class="grid-lines"></div>

<div class="wrapper">

  <nav>
    <a href="index.html" class="brand-logo">
      <img src="assets/logo.png" alt="Trade Championship Logo" class="brand-logo-img" />
      <span class="brand-title">BITQIK</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">🏠 ໜ້າຫຼັກ</a></li>
      <li><a href="register.html">📋 ລົງທະບຽນ</a></li>
      <li><a href="trade.html" style="color:var(--orange-light)">📈 Demo Trade</a></li>
    </ul>
  </nav>

  <div class="page-title">
    <div class="live-badge">REAL-TIME LIVE FEED</div>
    <h1>ອັນດັບຜູ້ເຂົ້າຮ່ວມ<span>ແຂ່ງຂັນ</span></h1>
    <p>ຕາຕະລາງ Leaderboard ຈັດອັນດັບ 25 Traders ແບບ Realtime</p>
  </div>

  <div class="podium-grid">
    <div class="podium-card rank-2">
      <div class="podium-avatar">NP</div>
      <div style="font-size:0.78rem; color:var(--text-sub); font-family:var(--font-lao);">RANK #2</div>
      <div class="podium-name">ນ້ອຍ ພ</div>
      <div class="podium-pnl" id="podium-2-pnl">+134.2%</div>
    </div>
    <div class="podium-card rank-1">
      <div style="font-size:2rem; margin-bottom:0.3rem;">👑</div>
      <div class="podium-avatar">KS</div>
      <div style="font-size:0.78rem; color:var(--orange-light); font-family:var(--font-lao); font-weight:800;">CHAMPION #1</div>
      <div class="podium-name">ໄຄ ສົມຣ</div>
      <div class="podium-pnl" id="podium-1-pnl">+156.4%</div>
    </div>
    <div class="podium-card rank-3">
      <div class="podium-avatar">DV</div>
      <div style="font-size:0.78rem; color:var(--text-sub); font-family:var(--font-lao);">RANK #3</div>
      <div class="podium-name">ແດງ ວ</div>
      <div class="podium-pnl" id="podium-3-pnl">+98.7%</div>
    </div>
  </div>

  <div class="lead-table-box">
    <table class="lead-table">
      <thead>
        <tr><th># Rank</th><th>Trader</th><th>Leverage</th><th>P&L %</th><th>Est. Profit</th><th>Status</th></tr>
      </thead>
      <tbody id="leaderboard-tbody"></tbody>
    </table>
  </div>

</div>

<script>
  let TRADERS = [
    { id:1, name:'ໄຄ ສົມຣ', leverage:'20x', pnl: 156.4, profit: 782 },
    { id:2, name:'ນ້ອຍ ພ', leverage:'15x', pnl: 134.2, profit: 671 },
    { id:3, name:'ແດງ ວ', leverage:'25x', pnl: 98.7, profit: 493 },
    { id:4, name:'ວັນນາ ຕ', leverage:'10x', pnl: 87.3, profit: 436 },
    { id:5, name:'ສີ ດາວ', leverage:'12x', pnl: 76.5, profit: 382 }
  ];

  function updateLeaderboard() {
    const userPos = JSON.parse(localStorage.getItem('bitqik_trade_position') || 'null');
    if (userPos) {
      TRADERS = TRADERS.filter(t => !t.isUser);
      TRADERS.push({ id:99, name:'👤 YOU (ທ່ານເອງ)', leverage:`${userPos.leverage||20}x`, pnl:24.5, profit:122, isUser:true });
    }
    TRADERS.sort((a,b) => b.pnl - a.pnl);

    if (TRADERS[0]) document.getElementById('podium-1-pnl').textContent = `+${TRADERS[0].pnl.toFixed(1)}%`;
    if (TRADERS[1]) document.getElementById('podium-2-pnl').textContent = `+${TRADERS[1].pnl.toFixed(1)}%`;
    if (TRADERS[2]) document.getElementById('podium-3-pnl').textContent = `+${TRADERS[2].pnl.toFixed(1)}%`;

    const tbody = document.getElementById('leaderboard-tbody');
    tbody.innerHTML = TRADERS.map((t, idx) => `
      <tr class="${t.isUser ? 'user-row' : ''}">
        <td style="font-weight:800; color:${idx === 0 ? 'var(--gold)' : '#fff'};">#${idx + 1}</td>
        <td><strong>${t.name}</strong></td>
        <td>${t.leverage}</td>
        <td style="font-weight:800; color:var(--green);">+${t.pnl.toFixed(1)}%</td>
        <td style="font-weight:700;">$${t.profit} USDT</td>
        <td><span style="background:rgba(0,255,136,0.15); color:var(--green); padding:0.2rem 0.6rem; border-radius:100px; font-size:0.72rem; font-weight:700;">🟢 Trading</span></td>
      </tr>
    `).join('');
  }

  updateLeaderboard();
  setInterval(updateLeaderboard, 4000);
</script>
</body>
</html>
